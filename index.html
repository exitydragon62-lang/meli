<!DOCTYPE html>
<html>

<head>

<title>Meli IA 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
background:#30051f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}


.app{
width:90%;
max-width:430px;
background:#ffb6d9;
padding:20px;
border-radius:25px;
}


h1{
text-align:center;
color:#ff1475;
}


#chat{
background:white;
height:360px;
overflow:auto;
padding:15px;
border-radius:15px;
}


input{
width:58%;
padding:12px;
border-radius:10px;
border:0;
}


button{
padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;
}


</style>

</head>


<body>


<div class="app">


<h1>💗 Meli IA</h1>


<div id="chat">

💗 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨

</div>


<br>


<input id="mensagem" placeholder="Digite ou fale...">


<button onclick="enviar()">
Enviar
</button>


<button onclick="ouvir()">
🎤
</button>


</div>




<script>


let memoria =
JSON.parse(localStorage.getItem("meli_memoria"))
|| {};


let aprendendo=false;

let perguntaEnsinar="";


let ouvindo=false;

let reconhecimento;







function salvar(){

localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);

}







function falar(texto){


speechSynthesis.cancel();



let limpo =
texto.replace(
/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
""
);



let fala =
new SpeechSynthesisUtterance(limpo);



fala.lang="pt-BR";

fala.rate=1;

fala.pitch=1.1;



let vozes =
speechSynthesis.getVoices();



let feminina =
vozes.find(v =>
v.lang.includes("pt") &&
(
v.name.toLowerCase().includes("female") ||
v.name.toLowerCase().includes("maria") ||
v.name.toLowerCase().includes("google")
)
);



if(feminina){

fala.voice=feminina;

}



speechSynthesis.speak(fala);


}








function escrever(texto){


let chat =
document.getElementById("chat");



chat.innerHTML +=
"<br><br>"+texto;



chat.scrollTop =
chat.scrollHeight;


}







function calcular(texto){


let conta =
texto.match(
/\d+\s*[\+\-\*\/]\s*\d+/
);



if(conta){


try{

return "O resultado é "
+eval(conta[0]);

}catch{}



}



return null;


}









function pensar(msg){



let texto =
msg.toLowerCase();



let conta =
calcular(texto);



if(conta)

return conta;





if(texto.includes("seu nome"))

return "Meu nome é Meli";




if(texto.includes("quem criou você"))

return "Eu fui criada pelo Luiz Benicio";




if(texto.includes("o que você é"))

return "Sou uma inteligência artificial que conversa e aprende";




if(memoria[texto])

return memoria[texto];





return null;


}









function enviar(){



let caixa =
document.getElementById("mensagem");



let msg =
caixa.value.trim();





if(msg=="")
return;





escrever(
"👤 Você: "+msg
);









if(aprendendo){



memoria[perguntaEnsinar]=msg;


salvar();



let resposta =
"Aprendi! Vou lembrar disso";



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



aprendendo=false;

perguntaEnsinar="";



caixa.value="";


return;


}









if(msg.toLowerCase()
.includes("quero te ensinar")){


let resposta =
"Claro! Me diga o que devo aprender";



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



aprendendo=true;



caixa.value="";


return;


}










let resposta =
pensar(msg);





if(resposta){



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



}



else{


let resposta =
"Eu ainda não sei isso. Se quiser me ensinar, diga: quero te ensinar";



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



perguntaEnsinar=msg;



}





caixa.value="";


}









function ouvir(){



if(!ouvindo){



reconhecimento =
new(
window.SpeechRecognition ||
window.webkitSpeechRecognition
);



reconhecimento.lang="pt-BR";

reconhecimento.continuous=true;



reconhecimento.start();



ouvindo=true;



escrever(
"🎤 Meli: Estou ouvindo..."
);





reconhecimento.onresult=function(event){



let texto="";



for(
let i=event.resultIndex;
i<event.results.length;
i++
){

texto +=
event.results[i][0].transcript;

}



document.getElementById("mensagem").value =
texto;



};



}



else{



reconhecimento.stop();


ouvindo=false;



setTimeout(()=>{

enviar();

},500);



}



}



</script>


</body>

</html>
