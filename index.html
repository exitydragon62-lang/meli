<!DOCTYPE html>
<html>

<head>

<title>Meli IA </title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
background:#30051f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.app{
width:90%;
max-width:430px;
background:#ffb6d9;
padding:20px;
border-radius:25px;
}

h1{
text-align:center;
color:#ff1475;
}

#chat{
background:white;
height:360px;
overflow:auto;
padding:15px;
border-radius:15px;
}

input{
width:58%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;
}

</style>

</head>


<body>


<div class="app">


<h1> Meli IA</h1>


<div id="chat">

 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨

</div>


<br>


<input id="mensagem" placeholder="Digite uma mensagem">


<button onclick="enviar()">
Enviar
</button>


</div>





<script type="module">


// FIREBASE

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




// COLOQUE SUA CONFIGURAÇÃO AQUI

const firebaseConfig = {

apiKey:"SUA_API_KEY",

authDomain:"SEU_DOMINIO",

projectId:"SEU_PROJECT_ID",

storageBucket:"",

messagingSenderId:"",

appId:""

};




const app =
initializeApp(firebaseConfig);



const db =
getFirestore(app);






let aprendendo=false;

let perguntaEnsinar="";





function escrever(texto){

let chat =
document.getElementById("chat");


chat.innerHTML +=
"<br><br>"+texto;


chat.scrollTop =
chat.scrollHeight;

}





function falar(texto){

let voz =
new SpeechSynthesisUtterance(texto);


voz.lang="pt-BR";


speechSynthesis.speak(voz);

}






// SALVAR NA MEMÓRIA GLOBAL

async function salvarMemoria(pergunta,resposta){


await setDoc(

doc(
db,
"memoria",
pergunta
),

{

resposta:resposta

}

);


}






// BUSCAR NA MEMÓRIA GLOBAL

async function buscarMemoria(pergunta){



let resultado =
await getDoc(

doc(
db,
"memoria",
pergunta
)

);



if(resultado.exists()){

return resultado.data().resposta;

}



return null;


}









async function pensar(msg){


let texto =
msg.toLowerCase();





if(texto.includes("seu nome"))
return "Meu nome é Meli";



if(texto.includes("quem criou você"))
return "Eu fui criada pelo Luiz Benicio";



let memoria =
await buscarMemoria(texto);



if(memoria)
return memoria;



return null;


}









async function enviar(){



let caixa =
document.getElementById("mensagem");


let msg =
caixa.value.trim();



if(msg=="")
return;




escrever(
"👤 Você: "+msg
);





if(aprendendo){



await salvarMemoria(
perguntaEnsinar,
msg
);



let resposta =
"Aprendi! Agora todos os usuários poderão saber disso ";



escrever(
" Meli: "+resposta
);


falar(resposta);



aprendendo=false;

perguntaEnsinar="";

caixa.value="";

return;

}






if(msg.toLowerCase()
.includes("quero te ensinar")){


let resposta =
"Claro! Me diga o que devo aprender ";



escrever(
" Meli: "+resposta
);


falar(resposta);



aprendendo=true;


caixa.value="";


return;


}






let resposta =
await pensar(msg);




if(resposta){



escrever(
"💗 Meli: "+resposta
);


falar(resposta);



}

else{


let resposta =
"Eu ainda não sei isso. Diga 'quero te ensinar' para me ensinar ";


escrever(
" Meli: "+resposta
);


falar(resposta);



perguntaEnsinar=msg;


}





caixa.value="";


}



</script>


</body>

</html>
