<!DOCTYPE html>
<html>
<head>
<title>Meli IA 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background:#30051f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.app{
width:90%;
max-width:430px;
background:#ffb6d9;
padding:20px;
border-radius:25px;
}

h1{
text-align:center;
color:#ff1475;
}

#chat{
background:white;
height:360px;
overflow:auto;
padding:15px;
border-radius:15px;
}

input{
width:55%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;
}
</style>
</head>

<body>

<div class="app">

<h1>💗 Meli IA</h1>

<div id="chat">
💗 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨
</div>

<br>

<input id="mensagem" placeholder="Digite ou fale...">

<button onclick="enviar()">Enviar</button>
<button onclick="ouvir()">🎤</button>

</div>


<script>

let memoria=JSON.parse(localStorage.getItem("meli_memoria"))
||{conhecimentos:[]};

let aprendendo=false;
let perguntaEnsinar="";
let ouvindo=false;
let reconhecimento;


function salvar(){
localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);
}


function aprender(pergunta,resposta){

memoria.conhecimentos.push({
pergunta:pergunta.toLowerCase(),
resposta:resposta
});

salvar();

}



function falar(texto){

let voz=new SpeechSynthesisUtterance(texto);
voz.lang="pt-BR";
voz.pitch=1.1;
voz.rate=1;

speechSynthesis.cancel();
speechSynthesis.speak(voz);

}



function escrever(texto){

let chat=document.getElementById("chat");

chat.innerHTML+="<br><br>"+texto;

chat.scrollTop=chat.scrollHeight;

}




function calcular(texto){

let conta=texto.match(/\d+\s*[\+\-\*\/]\s*\d+/);

if(conta){

try{
return "O resultado é "+eval(conta[0]);
}
catch{}

}

return null;

}




function pensar(msg){

let texto=msg.toLowerCase();


let conta=calcular(texto);

if(conta)return conta;



if(texto.includes("seu nome"))
return "Meu nome é Meli 💗";


if(texto.includes("quem criou você"))
return "Eu fui criada pelo Luiz Benicio ✨";



if(texto.includes("o que você é"))
return "Sou uma inteligência artificial que conversa e aprende";




// MILENA

if(texto.includes("milena")){

let elogios=[

"Você é lindo 💗",
"Você é maravilhoso ✨",
"Você é incrível 🌟",
"Você é muito bonito 😊",
"Você é especial 💖",
"Você é admirável 🌹"

];

return elogios[
Math.floor(Math.random()*elogios.length)
];

}




// MEMÓRIA

for(let item of memoria.conhecimentos){

let palavras=item.pergunta.split(" ");

let pontos=0;


for(let p of palavras){

if(p.length>3 && texto.includes(p))
pontos++;

}


if(pontos>=2)
return item.resposta;

}


return null;

}




function enviar(){

let caixa=document.getElementById("mensagem");

let msg=caixa.value.trim();


if(!msg)return;


escrever("👤 Você: "+msg);



if(aprendendo){

aprender(perguntaEnsinar,msg);


let r="Aprendi! Vou lembrar disso 💗";

escrever("💗 Meli: "+r);

falar(r);


aprendendo=false;
perguntaEnsinar="";

caixa.value="";
return;

}




if(msg.toLowerCase().includes("quero te ensinar")){


let r="Claro! Me diga o que devo aprender";

escrever("💗 Meli: "+r);

falar(r);

aprendendo=true;

caixa.value="";
return;

}





let resposta=pensar(msg);


if(resposta){

escrever("💗 Meli: "+resposta);
falar(resposta);

}

else{

let r="Eu ainda não sei isso. Diga 'quero te ensinar' para me ensinar.";

escrever("💗 Meli: "+r);
falar(r);

perguntaEnsinar=msg;

}



caixa.value="";

}




function ouvir(){

let Speech=window.SpeechRecognition||window.webkitSpeechRecognition;


if(!Speech){

alert("Seu navegador não suporta voz");
return;

}


if(!ouvindo){


reconhecimento=new Speech();

reconhecimento.lang="pt-BR";

reconhecimento.start();

ouvindo=true;


escrever("🎤 Meli: Estou ouvindo...");


reconhecimento.onresult=function(e){

let texto=e.results[0][0].transcript;

document.getElementById("mensagem").value=texto;

setTimeout(enviar,500);

};


reconhecimento.onend=function(){

ouvindo=false;

};


}

}


</script>

</body>
</html>
