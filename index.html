<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Meli IA 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #30051f;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.app {
  width: 90%;
  max-width: 430px;
  background: #ffb6d9;
  padding: 20px;
  border-radius: 25px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
}

h1 {
  text-align: center;
  color: #ff1475;
  margin-top: 0;
}

#chat {
  background: white;
  height: 360px;
  overflow-y: auto;
  padding: 15px;
  border-radius: 15px;
  word-wrap: break-word;
}

.input-container {
  display: flex;
  gap: 5px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  outline: none;
}

button {
  padding: 12px 15px;
  border: 0;
  border-radius: 10px;
  background: #ff4d9d;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ff1475;
}
</style>
</head>

<body>

<div class="app">
  <h1>💗 Meli IA</h1>

  <div id="chat">
    💗 Meli:<br>
    Olá! Eu sou a Meli.<br>
    Criada por Luiz Benicio ✨
  </div>

  <div class="input-container">
    <input id="mensagem" placeholder="Digite ou fale..." onkeydown="checarEnter(event)">
    <button onclick="enviar()">Enviar</button>
    <button onclick="ouvir()">🎤</button>
  </div>
</div>

<script>
let memoria = JSON.parse(localStorage.getItem("meli_memoria")) || { conhecimentos: [] };
let aprendendo = false;
let perguntaEnsinar = "";

function salvar() {
  localStorage.setItem("meli_memoria", JSON.stringify(memoria));
}

function falar(texto) {
  if (!('speechSynthesis' in window)) return;
  let voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "pt-BR";
  voz.pitch = 1.1;
  voz.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(voz);
}

function escrever(texto) {
  let chat = document.getElementById("chat");
  let div = document.createElement("div");
  div.innerHTML = "<br>" + texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function aprender(pergunta, resposta) {
  let existe = memoria.conhecimentos.find(x => x.pergunta === pergunta.toLowerCase());
  if (existe) {
    existe.resposta = resposta;
  } else {
    memoria.conhecimentos.push({
      pergunta: pergunta.toLowerCase(),
      resposta: resposta
    });
  }
  salvar();
}

function pensar(msg) {
  let texto = msg.toLowerCase().trim();

  // Saudações básicas
  if (["oi", "olá", "ola", "oie", "bom dia", "boa tarde", "boa noite"].includes(texto)) {
    return "Oie! Tudo bem com você? 💗";
  }

  // Informações básicas da Meli
  if (texto.includes("seu nome")) return "Meu nome é Meli 💗";
  if (texto.includes("quem criou você") || texto.includes("seu criador")) return "Eu fui criada pelo Luiz Benicio ✨";
  if (texto.includes("exity dragon")) return "Meu criador também é conhecido como Exity Dragon 💗";

  // Elogios carinhosos
  if (texto.includes("milena")) {
    let elogios = [
      "Linda 💗", "Maravilhosa ✨", "Perfeita 🌹", "Incrível ⭐",
      "Encantadora 💖", "Preciosa 💎", "Radiante ☀️", "Elegante ✨",
      "Charmosa 💗", "Deslumbrante 🌹", "Fascinante ⭐", "Única 💖", "Especial ✨"
    ];
    return elogios[Math.floor(Math.random() * elogios.length)];
  }

  // Busca na memória aprendida
  for (let item of memoria.conhecimentos) {
    if (texto === item.pergunta) return item.resposta;
    
    let palavras = item.pergunta.split(" ");
    let pontos = 0;
    for (let palavra of palavras) {
      if (palavra.length > 2 && texto.includes(palavra)) {
        pontos++;
      }
    }
    if (pontos >= 1) return item.resposta;
  }

  // Contas básicas (Cálculo seguro)
  let conta = texto.match(/[0-9]+\s*[\+\-\*\/]\s*[0-9]+/);
  if (conta) {
    try {
      let resultado = Function(`'use strict'; return (${conta[0]})`)();
      return "O resultado é: " + resultado + " 💗";
    } catch (e) {
      return null;
    }
  }

  return null;
}

function enviar() {
  let caixa = document.getElementById("mensagem");
  let msg = caixa.value.trim();

  if (!msg) return;

  escrever("👤 Você: " + msg);
  caixa.value = "";

  // Modo de aprendizado
  if (aprendendo) {
    aprender(perguntaEnsinar, msg);
    let resposta = "Aprendi! Vou lembrar disso 💗";
    escrever("💗 Meli: " + resposta);
    falar(resposta);
    aprendendo = false;
    perguntaEnsinar = "";
    return;
  }

  let resposta = pensar(msg);

  if (resposta) {
    escrever("💗 Meli: " + resposta);
    falar(resposta);
  } else {
    perguntaEnsinar = msg;
    aprendendo = true;
    let resposta = "Eu ainda não sei isso 💗 Me ensine a resposta e eu vou aprender!";
    escrever("💗 Meli: " + resposta);
    falar(resposta);
  }
}

function checarEnter(event) {
  if (event.key === "Enter") {
    enviar();
  }
}

function ouvir() {
  let Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Speech) {
    alert("Seu navegador não suporta reconhecimento de voz.");
    return;
  }

  let reconhecimento = new Speech();
  reconhecimento.lang = "pt-BR";
  reconhecimento.start();

  reconhecimento.onresult = function(event) {
    document.getElementById("mensagem").value = event.results[0][0].transcript;
    enviar();
  };

  reconhecimento.onerror = function() {
    alert("Não consegui ouvir. Tente novamente!");
  };
}
</script>

</body>
</html>
