<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meli AI</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff8fd8,#ff4fa3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:95%;
    max-width:420px;
    height:90vh;
    background:white;
    border-radius:25px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 30px #ff1493;
}


header{
    background:#ff5db1;
    color:white;
    text-align:center;
    padding:20px;
    font-size:25px;
    font-weight:bold;
}


#chat{
    flex:1;
    padding:15px;
    overflow-y:auto;
}


.msg{
    padding:12px;
    margin:10px;
    border-radius:20px;
    max-width:80%;
}


.user{
    background:#ffc1e5;
    margin-left:auto;
}


.meli{
    background:#ff5db1;
    color:white;
}


.area{
    display:flex;
    padding:10px;
    gap:5px;
}


input{
    flex:1;
    border-radius:20px;
    border:2px solid #ff5db1;
    padding:12px;
    outline:none;
}


button{
    border:none;
    background:#ff5db1;
    color:white;
    border-radius:50%;
    width:45px;
    height:45px;
    font-size:20px;
}


button:hover{
    transform:scale(1.1);
}

</style>

</head>


<body>


<div class="app">

<header>
💗 Meli AI
</header>


<div id="chat"></div>


<div class="area">

<input id="texto" placeholder="Digite uma mensagem...">

<button onclick="enviar()">➤</button>

<button onclick="ouvir()">🎤</button>

</div>


</div>




<script>


let memoria = JSON.parse(localStorage.getItem("meli_memoria")) || {};



function salvar(){

localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);

}




function adicionar(texto,tipo){

let div=document.createElement("div");

div.className="msg "+tipo;

div.innerHTML=texto;

document.getElementById("chat").appendChild(div);

document.getElementById("chat").scrollTop =
document.getElementById("chat").scrollHeight;

}





function falar(texto){

let voz=new SpeechSynthesisUtterance(texto);

voz.lang="pt-BR";

voz.pitch=1.2;

voz.rate=1;

let vozes=speechSynthesis.getVoices();


let feminina=vozes.find(v=>
v.name.includes("Maria") ||
v.name.includes("Google")
);


if(feminina)
voz.voice=feminina;


speechSynthesis.speak(voz);

}





function pensar(pergunta){

let p=pergunta.toLowerCase();



// memória aprendida

if(memoria[p]){

return memoria[p];

}



// criadora

if(
p.includes("quem criou") ||
p.includes("criador")
){

return "Eu fui criada por Exity Dragon e Luiz Benicio ❤️";

}



// nome

if(p.includes("seu nome")){

return "Meu nome é Meli 💗";

}



// matemática


try{

if(/[0-9+\-*\/]/.test(p)){

let resultado=eval(p);

return "O resultado é "+resultado;

}

}catch(e){}




return "Ainda não sei responder isso... Você pode me ensinar? ❤️";

}






function enviar(){


let input=document.getElementById("texto");

let mensagem=input.value;


if(mensagem=="") return;


adicionar(mensagem,"user");


input.value="";



let resposta=pensar(mensagem);



setTimeout(()=>{


adicionar(resposta,"meli");

falar(resposta);



},500);



}





// aprendizado

document.addEventListener("keydown",function(e){


if(e.key=="Enter"){

enviar();

}


});







// MICROFONE


function ouvir(){


let reconhecimento =
new(window.SpeechRecognition ||
window.webkitSpeechRecognition)();



reconhecimento.lang="pt-BR";


reconhecimento.start();



reconhecimento.onstart=function(){

alert("🎤 Meli está ouvindo...");

}



reconhecimento.onresult=function(event){


let texto=
event.results[0][0].transcript;


document.getElementById("texto").value=texto;


enviar();


}



}





adicionar(
"Olá! Eu sou a Meli 💗<br>Fale comigo pelo texto ou pelo microfone 🎤",
"meli"
);


</script>


</body>
</html>
