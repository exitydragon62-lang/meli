<!DOCTYPE html>
<html>

<head>

<title>Meli IA 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
background:#30051f;
font-family:Arial;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}


.app{
background:#ffb6d9;
width:90%;
max-width:430px;
padding:20px;
border-radius:25px;
}


h1{
text-align:center;
color:#ff1475;
}


#chat{
background:white;
height:350px;
overflow:auto;
padding:15px;
border-radius:15px;
}


input{
width:55%;
padding:12px;
border-radius:10px;
border:0;
}


button{
padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;
}

</style>

</head>



<body>


<div class="app">


<h1>💗 Meli IA</h1>


<div id="chat">

💗 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨

</div>


<br>


<input id="mensagem" placeholder="Digite ou fale...">


<button onclick="enviar()">
Enviar
</button>


<button onclick="voz()">
🎤
</button>


</div>





<script>


let memoria =
JSON.parse(localStorage.getItem("meli_memoria"))
|| {};



let aprendendo=false;

let perguntaAprender="";



let ouvindo=false;

let reconhecimento;







function salvar(){

localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);

}







function escrever(texto){


let chat =
document.getElementById("chat");


chat.innerHTML +=
"<br><br>"+texto;


chat.scrollTop =
chat.scrollHeight;


}









function falar(texto){


speechSynthesis.cancel();



let limpo =
texto.replace(
/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
""
);



let voz =
new SpeechSynthesisUtterance(limpo);



voz.lang="pt-BR";

voz.rate=1;

voz.pitch=1.2;



let vozes =
speechSynthesis.getVoices();



let feminina =
vozes.find(v =>
v.lang.includes("pt")
);



if(feminina){

voz.voice=feminina;

}



speechSynthesis.speak(voz);


}









function pensar(msg){



let texto =
msg.toLowerCase();



if(texto.includes("seu nome"))

return "Meu nome é Meli";




if(texto.includes("quem criou você"))

return "Eu fui criada pelo Luiz Benicio";




if(texto.includes("o que você é"))

return "Sou uma inteligência artificial que conversa e aprende";




if(memoria[texto])

return memoria[texto];



return null;


}









function enviar(){



let caixa =
document.getElementById("mensagem");



let msg =
caixa.value.trim();



if(msg==="")
return;





escrever(
"👤 Você: "+msg
);






if(aprendendo){



memoria[perguntaAprender]=msg;


salvar();



let resposta =
"Aprendi! Vou lembrar disso 💗";



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



aprendendo=false;

perguntaAprender="";


caixa.value="";

return;


}









if(msg.toLowerCase()
.includes("quero te ensinar")){


let resposta =
"Claro! Me diga o que devo aprender 💗";



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



aprendendo=true;


caixa.value="";

return;


}







let resposta =
pensar(msg);





if(resposta){



escrever(
"💗 Meli: "+resposta
);



falar(resposta);



}

else{


let resposta =
"Eu ainda não sei isso. Me ensine a resposta 💗";


escrever(
"💗 Meli: "+resposta
);



falar(resposta);



perguntaAprender=msg;


aprendendo=true;



}



caixa.value="";


}









// SISTEMA DE VOZ CORRIGIDO


function voz(){



let Reconhecimento =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!Reconhecimento){


alert(
"Seu navegador não suporta reconhecimento de voz"
);


return;

}






if(!ouvindo){



reconhecimento =
new Reconhecimento();



reconhecimento.lang="pt-BR";



reconhecimento.continuous=true;



reconhecimento.interimResults=true;



reconhecimento.start();



ouvindo=true;



escrever(
"🎤 Meli: Estou ouvindo..."
);






reconhecimento.onresult=function(event){



let texto="";



for(
let i=event.resultIndex;
i<event.results.length;
i++
){


texto +=
event.results[i][0].transcript;


}




document.getElementById("mensagem").value =
texto;



};






reconhecimento.onerror=function(){


ouvindo=false;


escrever(
"❌ Não consegui ouvir"
);


};






}

else{


ouvindo=false;



reconhecimento.stop();



escrever(
"✅ Texto capturado"
);


}


}




</script>


</body>

</html>
