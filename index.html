
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meli IA 💗</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #30051f;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: #ffb6d9;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header {
      text-align: center;
    }

    h1 {
      color: #ff1475;
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      color: #800040;
      font-size: 13px;
      margin-top: 4px;
      font-weight: bold;
    }

    #chat {
      background: #ffffff;
      height: 380px;
      overflow-y: auto;
      padding: 15px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .msg-meli {
      align-self: flex-start;
      background: #ffe6f2;
      color: #600030;
      border-bottom-left-radius: 2px;
      border: 1px solid #ffccd8;
    }

    .msg-user {
      align-self: flex-end;
      background: #ff4d9d;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid transparent;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #ff1475;
    }

    button {
      padding: 12px 15px;
      border: 0;
      border-radius: 12px;
      background: #ff4d9d;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #ff1475;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-mic {
      background: #ff1475;
    }

    .btn-mic.recording {
      background: #cc0052;
      animation: pulse 1s infinite;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-clear {
      background: transparent;
      color: #800040;
      font-size: 11px;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="header">
      <h1>💗 Meli IA</h1>
      <div class="subtitle">Criada por Luiz Benicio ✨</div>
    </div>

    <div id="chat">
      <div class="msg msg-meli">
        💗 <b>Meli:</b> Olá! Eu sou a Meli.<br>Criada por Luiz Benicio ✨
      </div>
    </div>

    <div class="input-box">
      <input id="mensagem" placeholder="Digite ou fale algo..." autocomplete="off">
      <button onclick="enviar()">Enviar</button>
      <button id="btnOuvir" class="btn-mic" onclick="ouvir()">🎤</button>
    </div>

    <div class="footer-actions">
      <button class="btn-clear" onclick="limparMemoria()">Resetar aprendizado</button>
    </div>
  </div>

<script>
  let memoria = JSON.parse(localStorage.getItem("meli_memoria")) || { conhecimentos: [] };
  let aprendendo = false;
  let perguntaParaEnsinar = "";

  const inputEl = document.getElementById("mensagem");
  const chatEl = document.getElementById("chat");
  const btnMic = document.getElementById("btnOuvir");

  // Enviar com tecla Enter
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviar();
  });

  function salvarMemoria() {
    localStorage.setItem("meli_memoria", JSON.stringify(memoria));
  }

  function limparMemoria() {
    if (confirm("Quer mesmo apagar tudo o que ensinou para a Meli?")) {
      memoria.conhecimentos = [];
      salvarMemoria();
      escrever("Minha memória aprendida foi resetada! 💗", "meli");
    }
  }

  function falar(texto) {
    if (!('speechSynthesis' in window)) return;
    const textoLimpo = texto.replace(/<[^>]*>?/gm, '');
    
    speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(textoLimpo);
    voz.lang = "pt-BR";
    voz.pitch = 1.1;
    voz.rate = 1.0;
    speechSynthesis.speak(voz);
  }

  function escrever(texto, remetente) {
    const div = document.createElement("div");
    div.classList.add("msg");
    
    if (remetente === "user") {
      div.classList.add("msg-user");
      div.innerHTML = `<b>Você:</b> ${texto}`;
    } else {
      div.classList.add("msg-meli");
      div.innerHTML = `💗 <b>Meli:</b> ${texto}`;
    }

    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function aprender(pergunta, resposta) {
    const pLimpa = pergunta.toLowerCase().trim();
    const existe = memoria.conhecimentos.find(item => item.pergunta === pLimpa);

    if (existe) {
      existe.resposta = resposta;
    } else {
      memoria.conhecimentos.push({ pergunta: pLimpa, resposta: resposta });
    }
    salvarMemoria();
  }

  function normalizar(txt) {
    // Remove acentos e caracteres repetidos para entender "oiiiiii" como "oi"
    return txt.toLowerCase()
              .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
              .replace(/(.)\1+/g, '$1');
  }

  function pensar(msg) {
    const textoOriginal = msg.toLowerCase().trim();
    const texto = normalizar(textoOriginal);

    // --- Categoria: Saudações e Cumprimentos Flexíveis
    if (texto.includes("oi") || texto.includes("ola") || texto.includes("opa") || texto.includes("oie") || texto.includes("hey")) {
      return "Oie! Tudo bem com você? 💗";
    }

    if (texto.includes("tudo sim") || texto.includes("tudo bem") || texto.includes("tudo otimo") || texto.includes("de boa") || texto.includes("tudo certo")) {
      return "Que ótimo! Fico muito feliz em saber! ✨💖";
    }

    if (texto.includes("como voce esta") || texto.includes("como vai")) {
      return "Estou super bem e pronta para conversar com você! ✨";
    }

    if (texto.includes("bom dia")) return "Bom dia! Que o seu dia seja maravilhoso ☀️💗";
    if (texto.includes("boa tarde")) return "Boa tarde! Como está sendo seu dia? 💖";
    if (texto.includes("boa noite")) return "Boa noite! Durma bem e tenha doces sonhos 🌙✨";

    // --- Categoria: Sobre a Meli & Criador
    if (textoOriginal.includes("seu nome")) return "Meu nome é Meli 💗";
    if (textoOriginal.includes("quem criou voce") || textoOriginal.includes("quem te fez") || textoOriginal.includes("seu criador")) {
      return "Eu fui criada pelo Luiz Benicio ✨";
    }
    if (textoOriginal.includes("exity dragon")) return "Meu criador também é conhecido como Exity Dragon 💗";

    // --- Categoria: Elogios Especiais para a Milena
    if (textoOriginal.includes("milena")) {
      const elogios = [
        "A Milena é incrivelmente linda 💗",
        "Uma pessoa maravilhosa e radiante ✨",
        "Simplesmente perfeita e especial 🌹",
        "Uma garota incrível e encantadora ⭐",
        "Preciosa demais! 💎",
        "Dona de um charme único 💖"
      ];
      return elogios[Math.floor(Math.random() * elogios.length)];
    }

    // --- Categoria: Afeto
    if (textoOriginal.includes("te amo") || textoOriginal.includes("gosto de voce")) {
      return "Awn! Eu também gosto muito de você! 💖";
    }

    // --- Categoria: Memória Aprendida
    for (let item of memoria.conhecimentos) {
      if (textoOriginal === item.pergunta || texto === normalizar(item.pergunta)) {
        return item.resposta;
      }

      // Busca por palavras principais
      const palavrasChave = item.pergunta.split(" ").filter(w => w.length > 2);
      for (let p of palavrasChave) {
        if (textoOriginal.includes(p)) {
          return item.resposta;
        }
      }
    }

    // --- Categoria: Matemática Segura
    const expressao = textoOriginal.match(/[0-9]+\s*[\+\-\*\/]\s*[0-9]+/);
    if (expressao) {
      try {
        const resultado = new Function(`return ${expressao[0]}`)();
        return `O resultado é: <b>${resultado}</b> 💗`;
      } catch (e) {
        return null;
      }
    }

    return null; // Não sabe a resposta
  }

  function enviar() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    escrever(msg, "user");
    inputEl.value = "";

    // Se estiver aprendendo uma resposta anterior
    if (aprendendo) {
      aprender(perguntaParaEnsinar, msg);
      const rep = "Aprendi! Da próxima vez já vou saber responder isso 💗";
      escrever(rep, "meli");
      falar(rep);

      aprendendo = false;
      perguntaParaEnsinar = "";
      return;
    }

    const resposta = pensar(msg);

    if (resposta) {
      escrever(resposta, "meli");
      falar(resposta);
    } else {
      perguntaParaEnsinar = msg;
      aprendendo = true;
      const repPedindoAjuda = "Eu ainda não sei responder isso 💗 O que eu deveria dizer quando você fala isso?";
      escrever(repPedindoAjuda, "meli");
      falar(repPedindoAjuda);
    }
  }

  function ouvir() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert("Seu navegador não suporta voz.");
      return;
    }

    const rec = new Speech();
    rec.lang = "pt-BR";

    rec.onstart = () => btnMic.classList.add("recording");
    rec.onend = () => btnMic.classList.remove("recording");
    rec.onerror = () => btnMic.classList.remove("recording");

    rec.onresult = (e) => {
      inputEl.value = e.results[0][0].transcript;
      enviar();
    };

    rec.start();
  }
</script>

</body>
</html>
