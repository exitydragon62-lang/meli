<!DOCTYPE html>
<html>
<head>
<title>Meli IA 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
background:#30051f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.app{
width:90%;
max-width:430px;
background:#ffb6d9;
padding:20px;
border-radius:25px;
}

h1{
text-align:center;
color:#ff1475;
}

#chat{
background:white;
height:360px;
overflow:auto;
padding:15px;
border-radius:15px;
}

input{
width:55%;
padding:12px;
border-radius:10px;
border:0;
}

button{
padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;
}
</style>
</head>

<body>

<div class="app">

<h1>💗 Meli IA</h1>

<div id="chat">
💗 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨
</div>

<br>

<input id="mensagem" placeholder="Digite ou fale...">

<button onclick="enviar()">Enviar</button>
<button onclick="ouvir()">🎤</button>

</div>


<script>

let memoria=JSON.parse(localStorage.getItem("meli_memoria"))
||{conhecimentos:[]};

let aprendendo=false;
let perguntaEnsinar="";
let ouvindo=false;
let reconhecimento;



function salvar(){
localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);
}



function aprender(p,r){

memoria.conhecimentos.push({
pergunta:p.toLowerCase(),
resposta:r
});

salvar();

}



function escrever(txt){

let chat=document.getElementById("chat");

let div=document.createElement("div");

div.innerHTML=txt;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}



function falar(txt){

let voz=new SpeechSynthesisUtterance(txt);

voz.lang="pt-BR";
voz.rate=1;
voz.pitch=1.1;

speechSynthesis.cancel();
speechSynthesis.speak(voz);

}




function calcular(t){

let c=t.match(/\d+\s*[\+\-\*\/]\s*\d+/);

if(c){

try{
return "O resultado é "+eval(c[0]);
}
catch{}

}

return null;

}




function pensar(msg){

let texto=msg.toLowerCase();



let conta=calcular(texto);

if(conta)return conta;



if(texto.includes("seu nome"))
return "Meu nome é Meli 💗";



if(texto.includes("quem criou você"))
return "Eu fui criada pelo Luiz Benicio ✨";



if(texto.includes("o que você é"))
return "Sou uma inteligência artificial que conversa e aprende";




// MILENA 💗

if(texto.includes("milena")){

let elogios=[

"Você é linda 💗",
"Você é maravilhosa ✨",
"Você é perfeita 🌹",
"Você é incrível ⭐",
"Você é encantadora 💖",
"Você é preciosa 💎",
"Você é radiante ☀️",
"Você é elegante ✨",
"Você é charmosa 💗",
"Você é deslumbrante 🌹",
"Você é fascinante ⭐",
"Você é única 💖",
"Você é especial ✨",
"Você é doce e delicada 🌸",
"Você é iluminada e brilhante 💗",
"Você é dona de um sorriso lindo 💖",
"Você tem uma beleza incrível ✨",
"Você é uma pessoa cativante"

];

return elogios[
Math.floor(Math.random()*elogios.length)
];

}



// MEMÓRIA

for(let item of memoria.conhecimentos){

let palavras=item.pergunta.split(" ");

let pontos=0;


for(let p of palavras){

if(p.length>3 && texto.includes(p))
pontos++;

}


if(pontos>=2)
return item.resposta;

}


return null;

}



function enviar(){

let caixa=document.getElementById("mensagem");

let msg=caixa.value.trim();


if(msg=="")return;


escrever("👤 Você: "+msg);

caixa.value="";



if(aprendendo){

aprender(perguntaEnsinar,msg);

let r="Aprendi! Vou lembrar disso 💗";

escrever("💗 Meli: "+r);

falar(r);

aprendendo=false;

return;

}



if(msg.toLowerCase().includes("quero te ensinar")){

let r="Claro! Me diga o que devo aprender";

escrever("💗 Meli: "+r);

falar(r);

aprendendo=true;

return;

}



let resposta=pensar(msg);



if(resposta){

escrever("💗 Meli: "+resposta);

falar(resposta);

}

else{

let r="Ainda não sei isso. Diga 'quero te ensinar' para me ensinar.";

escrever("💗 Meli: "+r);

falar(r);

perguntaEnsinar=msg;

}


}



function ouvir(){

let Speech=
window.SpeechRecognition||
window.webkitSpeechRecognition;


if(!Speech){

alert("Navegador sem suporte a voz");

return;

}


reconhecimento=new Speech();

reconhecimento.lang="pt-BR";

reconhecimento.start();


reconhecimento.onresult=function(e){

document.getElementById("mensagem").value=
e.results[0][0].transcript;

enviar();

};

}

</script>

</body>
</html>
