<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meli AI</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;
background:linear-gradient(135deg,#ff8bd8,#ff3b9d);
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;

}



.app{

width:95%;
max-width:430px;
height:90vh;
background:white;
border-radius:25px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 30px #ff1493;

}



header{

background:#ff4fa3;
color:white;
padding:20px;
font-size:26px;
font-weight:bold;
text-align:center;

}



#chat{

flex:1;
overflow-y:auto;
padding:15px;

}



.msg{

padding:12px 15px;
border-radius:20px;
margin:10px;
max-width:80%;

}



.usuario{

background:#ffd0eb;
margin-left:auto;

}



.meli{

background:#ff4fa3;
color:white;

}



.area{

display:flex;
gap:5px;
padding:10px;

}



input{

flex:1;
border-radius:20px;
border:2px solid #ff4fa3;
padding:12px;
font-size:16px;

}



button{

width:45px;
height:45px;
border:none;
border-radius:50%;
background:#ff4fa3;
color:white;
font-size:20px;

}



</style>

</head>


<body>


<div class="app">


<header>
💗 Meli AI
</header>



<div id="chat"></div>



<div class="area">

<input id="texto" placeholder="Fale comigo...">

<button onclick="enviar()">➤</button>

<button onclick="microfone()">🎤</button>

</div>



</div>





<script>


let chat=document.getElementById("chat");


// MEMÓRIA

let memoria =
JSON.parse(localStorage.getItem("meli_memoria")) || {};



let vozes=[];



function carregarVozes(){

vozes=speechSynthesis.getVoices();

}


speechSynthesis.onvoiceschanged=carregarVozes;

carregarVozes();






function adicionar(texto,tipo){


let div=document.createElement("div");

div.className="msg "+tipo;

div.innerHTML=texto;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}








// VOZ DA MELI


function falar(texto){


speechSynthesis.cancel();



let fala =
new SpeechSynthesisUtterance(texto);



fala.lang="pt-BR";

fala.pitch=1.4;

fala.rate=0.9;



let feminina =
vozes.find(v=>

v.lang.includes("pt") &&

(
v.name.includes("Maria") ||
v.name.includes("Google") ||
v.name.includes("Luciana")
)

);



if(feminina){

fala.voice=feminina;

}



setTimeout(()=>{

speechSynthesis.speak(fala);

},300);



}








function salvar(){


localStorage.setItem(
"meli_memoria",
JSON.stringify(memoria)
);


}









function pensar(pergunta){


let p=pergunta.toLowerCase();





// ENSINAR


if(p.startsWith("ensine:")){


let dados =
p.replace("ensine:","").trim();



let partes =
dados.split("=");



if(partes.length==2){



let perguntaNova =
partes[0].trim();



let respostaNova =
partes[1].trim();



memoria[perguntaNova]=respostaNova;



salvar();



return "Aprendi isso 💗 Obrigada por me ensinar!";


}


return "Use assim:<br>ensine: pergunta = resposta";


}







// MEMORIA



for(let pergunta in memoria){


if(p.includes(pergunta)){


return memoria[pergunta];


}


}







if(p.includes("oi") ||
p.includes("olá")){


return "Olá 💗 Eu sou a Meli!";


}






if(p.includes("seu nome")){


return "Meu nome é Meli 💕";


}






if(p.includes("quem criou")){


return "Eu fui criada por Exity Dragon e Luiz Benicio ❤️";


}








// MATEMÁTICA



try{


if(/[0-9+\-*\/]/.test(p)){



let resultado=eval(p);



return "O resultado é "+resultado;


}


}catch(e){}







return "Eu ainda não sei isso 😢 Você pode me ensinar usando: ensine: pergunta = resposta";



}









function enviar(){



let campo=document.getElementById("texto");


let texto=campo.value;



if(texto.trim()=="") return;



adicionar(texto,"usuario");


campo.value="";



let resposta= pensar(texto);



setTimeout(()=>{


adicionar(resposta,"meli");


falar(resposta);



},500);



}










// MICROFONE



function microfone(){



let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){


alert("Abra pelo Google Chrome para usar o microfone");


return;


}



let ouvir =
new SpeechRecognition();



ouvir.lang="pt-BR";

ouvir.continuous=false;



ouvir.start();





ouvir.onstart=function(){


console.log("Meli ouvindo...");


};





ouvir.onresult=function(event){



let texto =
event.results[0][0].transcript;



document.getElementById("texto").value=texto;



// ENVIA AUTOMATICAMENTE

enviar();



};





ouvir.onerror=function(){


alert("Não consegui entender o áudio");


};



}







adicionar(
"Oi 💗 Eu sou a Meli.<br>Clique no 🎤 e fale comigo!",
"meli"
);



</script>


</body>

</html>
