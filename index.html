<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meli AI</title>

<style>

body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff8bd8,#ff3fa4);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}


.app{

    width:95%;
    max-width:420px;
    height:90vh;
    background:white;
    border-radius:25px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 30px pink;

}



header{

    background:#ff4fa3;
    color:white;
    padding:20px;
    text-align:center;
    font-size:25px;
    font-weight:bold;

}



#chat{

    flex:1;
    padding:15px;
    overflow:auto;

}



.msg{

    padding:12px;
    margin:10px;
    border-radius:20px;
    max-width:80%;

}


.usuario{

    background:#ffc6e8;
    margin-left:auto;

}



.meli{

    background:#ff4fa3;
    color:white;

}



.area{

    display:flex;
    padding:10px;
    gap:5px;

}



input{

    flex:1;
    border-radius:20px;
    border:2px solid #ff4fa3;
    padding:12px;

}



button{

    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#ff4fa3;
    color:white;
    font-size:20px;

}


</style>

</head>


<body>


<div class="app">


<header>
💗 Meli AI
</header>



<div id="chat"></div>



<div class="area">

<input id="texto" placeholder="Digite algo...">


<button onclick="enviar()">➤</button>


<button onclick="microfone()">🎤</button>


</div>


</div>





<script>


let chat=document.getElementById("chat");



function mensagem(txt,tipo){


let div=document.createElement("div");

div.className="msg "+tipo;

div.innerHTML=txt;

chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}





// VOZ DA MELI


function falar(txt){


let fala=new SpeechSynthesisUtterance(txt);


fala.lang="pt-BR";


fala.pitch=1.3; // voz mais feminina


fala.rate=1;



let vozes=speechSynthesis.getVoices();



let vozFeminina=vozes.find(v=>

v.lang.includes("pt") &&

(v.name.includes("Maria") ||
v.name.includes("Female") ||
v.name.includes("Google"))

);



if(vozFeminina){

fala.voice=vozFeminina;

}



speechSynthesis.speak(fala);


}





// INTELIGENCIA DA MELI


function pensar(pergunta){


let p=pergunta.toLowerCase();



if(p.includes("oi") ||
p.includes("olá")){

return "Olá 💗 Eu sou a Meli, sua inteligência artificial.";

}



if(p.includes("seu nome")){

return "Meu nome é Meli 💕";

}



if(p.includes("criou") ||
p.includes("criador")){

return "Eu fui criada por Exity Dragon e Luiz Benicio ❤️";

}



// calculadora


try{


if(/[0-9+\-*\/]/.test(p)){


return "O resultado é "+eval(p);


}


}catch(e){}



return "Ainda estou aprendendo isso 💗";



}




function enviar(){


let input=document.getElementById("texto");


let texto=input.value;


if(texto=="")return;



mensagem(texto,"usuario");


input.value="";



let resposta=pensar(texto);



setTimeout(()=>{


mensagem(resposta,"meli");


falar(resposta);



},500);



}






// MICROFONE


function microfone(){



let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert("Seu navegador não suporta voz");

return;

}



let ouvir=new SpeechRecognition();



ouvir.lang="pt-BR";



ouvir.continuous=false;



ouvir.start();



ouvir.onstart=function(){

console.log("Meli ouvindo...");

}



ouvir.onresult=function(event){



let texto =
event.results[0][0].transcript;



// coloca o texto no chat

document.getElementById("texto").value=texto;



// envia sozinho

enviar();



}



ouvir.onerror=function(){

alert("Não consegui ouvir, tente novamente");

}


}






mensagem(
"Oi 💗 Eu sou a Meli! Clique no 🎤 e fale comigo.",
"meli"
);


</script>


</body>
</html>
