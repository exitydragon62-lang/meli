<!DOCTYPE html>
<html>
<head>

<title>Meli IA 💗</title>

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<style>

body{

background:#30051f;

font-family:Arial;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

margin:0;

}


.app{

width:90%;

max-width:430px;

background:#ffb6d9;

padding:20px;

border-radius:25px;

}


h1{

text-align:center;

color:#ff1475;

}


#chat{

background:white;

height:360px;

overflow:auto;

padding:15px;

border-radius:15px;

}


input{

width:55%;

padding:12px;

border:0;

border-radius:10px;

}


button{

padding:12px;

border:0;

border-radius:10px;

background:#ff4d9d;

color:white;

}

</style>

</head>


<body>


<div class="app">


<h1>💗 Meli IA</h1>


<div id="chat">

💗 Meli:<br>

Olá! Eu sou a Meli.<br>

Criada por Luiz Benicio ✨

</div>


<br>


<input id="mensagem" placeholder="Digite ou fale...">


<button onclick="enviar()">Enviar</button>

<button onclick="ouvir()">🎤</button>


</div>



<script>


let memoria = JSON.parse(localStorage.getItem("meli_memoria"))

|| { conhecimentos:[] };



let aprendendo=false;

let perguntaEnsinar="";



function salvar(){

localStorage.setItem(

"meli_memoria",

JSON.stringify(memoria)

);

}



function falar(texto){


let voz=new SpeechSynthesisUtterance(texto);


voz.lang="pt-BR";

voz.pitch=1.1;

voz.rate=1;



speechSynthesis.cancel();

speechSynthesis.speak(voz);


}




function escrever(texto){


let chat=document.getElementById("chat");


let div=document.createElement("div");


div.innerHTML="<br>"+texto;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}




function aprender(pergunta,resposta){


let existe = memoria.conhecimentos.find(

x=>x.pergunta===pergunta.toLowerCase()

);



if(existe){


existe.resposta=resposta;


}

else{


memoria.conhecimentos.push({

pergunta:pergunta.toLowerCase(),

resposta:resposta

});


}


salvar();


}function pensar(msg){

let texto = msg.toLowerCase();



// Informações básicas da Meli

if(texto.includes("seu nome"))

return "Meu nome é Meli 💗";



if(texto.includes("quem criou você"))

return "Eu fui criada pelo Luiz Benicio ✨";



if(texto.includes("exity dragon"))

return "Meu criador também é conhecido como Exity Dragon 💗";




// Elogios para Milena

if(texto.includes("milena")){


let elogios=[

"Linda 💗",

"Maravilhosa ✨",

"Perfeita 🌹",

"Incrível ⭐",

"Encantadora 💖",

"Preciosa 💎",

"Radiante ☀️",

"Elegante ✨",

"Charmosa 💗",

"Deslumbrante 🌹",

"Fascinante ⭐",

"Única 💖",

"Especial ✨"

];


return elogios[Math.floor(Math.random()*elogios.length)];


}





// Memória aprendida

for(let item of memoria.conhecimentos){


let palavras=item.pergunta.split(" ");

let pontos=0;



for(let palavra of palavras){


if(palavra.length > 2 && texto.includes(palavra)){


pontos++;


}


}



if(pontos >= 2){


return item.resposta;


}


}





// Contas básicas

let conta = texto.match(/[0-9]+[\+\-\*\/][0-9]+/);



if(conta){


try{


return "O resultado é: " + eval(conta[0]) + " 💗";


}

catch(e){


return null;


}


}




return null;


}function enviar(){


let caixa=document.getElementById("mensagem");

let msg=caixa.value.trim();



if(!msg)return;



escrever("👤 Você: "+msg);



caixa.value="";




// Se estiver aprendendo

if(aprendendo){


aprender(perguntaEnsinar,msg);



let resposta="Aprendi! Vou lembrar disso 💗";


escrever("💗 Meli: "+resposta);


falar(resposta);



aprendendo=false;

perguntaEnsinar="";


return;


}





let resposta=pensar(msg);




if(resposta){


escrever("💗 Meli: "+resposta);


falar(resposta);


}

else{


perguntaEnsinar=msg;


aprendendo=true;



let resposta=

"Eu ainda não sei isso 💗 Me ensine a resposta e eu vou aprender!";



escrever("💗 Meli: "+resposta);


falar(resposta);


}



}





function ouvir(){



let Speech=

window.SpeechRecognition ||

window.webkitSpeechRecognition;



if(!Speech){


alert("Seu navegador não suporta voz");


return;


}




let reconhecimento=new Speech();



reconhecimento.lang="pt-BR";



reconhecimento.start();




reconhecimento.onresult=function(event){



document.getElementById("mensagem").value=

event.results[0][0].transcript;



enviar();



}



}




</script>


</body>

</html>
