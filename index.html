<!DOCTYPE html>
<html>

<head>

<title>Meli IA 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

body{
background:#30051f;
font-family:Arial;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}


.app{

background:#ffb6d9;
width:90%;
max-width:430px;
padding:20px;
border-radius:25px;

}


h1{

text-align:center;
color:#ff1475;

}


#chat{

background:white;
height:350px;
overflow:auto;
padding:15px;
border-radius:15px;

}


input{

width:55%;
padding:12px;
border-radius:10px;
border:0;

}


button{

padding:12px;
border:0;
border-radius:10px;
background:#ff4d9d;
color:white;

}


</style>

</head>


<body>


<div class="app">


<h1>💗 Meli IA</h1>


<div id="chat">

💗 Meli:
<br>
Olá! Eu sou a Meli.
<br>
Criada por Luiz Benicio ✨

</div>


<br>


<input id="mensagem" placeholder="Digite ou fale">


<button onclick="enviar()">
Enviar
</button>


<button onclick="voz()">
🎤
</button>


</div>





<script>


let memoria =
JSON.parse(localStorage.getItem("meli"))
|| {};


let aprendendo=false;

let pergunta="";






function salvar(){

localStorage.setItem(
"meli",
JSON.stringify(memoria)
);

}







function escrever(texto){

let chat =
document.getElementById("chat");


chat.innerHTML +=
"<br><br>"+texto;


chat.scrollTop =
chat.scrollHeight;

}







function falar(texto){


let limpo =
texto.replace(
/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu,
""
);



let voz =
new SpeechSynthesisUtterance(limpo);



voz.lang="pt-BR";

voz.pitch=1.2;

voz.rate=1;



speechSynthesis.speak(voz);


}







function pensar(msg){


let m =
msg.toLowerCase();



if(m.includes("seu nome"))

return "Meu nome é Meli";



if(m.includes("quem criou você"))

return "Eu fui criada pelo Luiz Benicio";



if(m.includes("o que você é"))

return "Sou uma inteligência artificial que conversa e aprende";



if(memoria[m])

return memoria[m];



return null;


}









function enviar(){


let caixa =
document.getElementById("mensagem");


let msg =
caixa.value.trim();



if(msg==="")
return;




escrever(
"👤 Você: "+msg
);






if(aprendendo){


memoria[pergunta]=msg;


salvar();



let resposta =
"Aprendi! Vou lembrar disso";



escrever(
"💗 Meli: "+resposta
);


falar(resposta);



aprendendo=false;

pergunta="";

caixa.value="";

return;

}







if(msg.toLowerCase()
.includes("quero te ensinar")){


let resposta =
"Claro! Me diga o que devo aprender";


escrever(
"💗 Meli: "+resposta
);



falar(resposta);



aprendendo=true;


caixa.value="";


return;


}







let resposta =
pensar(msg);





if(resposta==null){


resposta =
"Eu ainda não sei isso. Você pode me ensinar.";


pergunta=msg;

aprendendo=true;


}




escrever(
"💗 Meli: "+resposta
);



falar(resposta);



caixa.value="";


}









function voz(){


let Reconhecimento =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!Reconhecimento){

alert("Seu navegador não suporta voz");

return;

}



let ouvir =
new Reconhecimento();



ouvir.lang="pt-BR";


ouvir.start();



escrever(
"🎤 Meli: Estou ouvindo..."
);



ouvir.onresult=function(event){


let texto =
event.results[0][0].transcript;



document.getElementById("mensagem").value =
texto;



// envia automaticamente

setTimeout(()=>{

enviar();

},500);



};



}


</script>


</body>

</html>
